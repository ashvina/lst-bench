trigger: none

parameters:
- name: lsts
  type: object
  default:
    - table_format: "iceberg"
      version: "1.1.0"
      #TODO update iceberg version
      mode: "mor"
- name: workloads
  type: object
  default:
    - "wp1_longevity"
- name: exp_scale_factor
  type: number
  default: 1000
- name: exp_machine
  type: string
  default: "Standard_E8s_v5"
- name: exp_cluster_size
  type: number
  default: 6
- name: infra_environment
  type: string
  default: "formats-testing"
- name: dbgen_data_path
  type: string
  default: "dbgen"

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-ntp -B -Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
  EXP_SCALE_FACTOR: ${{ parameters.exp_scale_factor }}
  EXP_MACHINE: ${{ parameters.exp_machine }}
  EXP_CLUSTER_SIZE: ${{ parameters.exp_cluster_size }}
  JDK_INSTALLER_NAME: 'openjdk-17-jdk-headless'
  JDK_VERSION: '1.17'
  JDK_HOME: '/usr/lib/jvm/java-17-openjdk-amd64'
  SPARK_VERSION: '3.3.1'
  DBGEN_DATA_PATH: ${{ parameters.dbgen_data_path }}

stages:
# Build LST-Bench and create artifact to deploy to target VM
- stage: build_lst_bench
  jobs:
  - job: Build
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Cache@2
      displayName: Cache Maven local repo
      inputs:
        key: 'maven | "$(Agent.OS)" | **/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
          maven
        path: $(MAVEN_CACHE_FOLDER)
    - task: Maven@4
      inputs:
        mavenPomFile: 'pom.xml'
        options: $(MAVEN_OPTS)
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '$(JDK_VERSION)'
        publishJUnitResults: false
        goals: 'package -DskipTests -Pspark-jdbc'
    - task: CopyFiles@2
      displayName: 'Copy Artifacts to: $(TargetFolder)'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        TargetFolder: '$(System.DefaultWorkingDirectory)/pipeline-artifacts/'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/pipeline-artifacts/'
        artifact: lst-bench-0.1-SNAPSHOT

# Set up engine and deploy LST-Bench
- stage: deploy_spark
  jobs:
  - deployment: EngineDeploy
    displayName: 'Deploying engine'
    workspace:
      clean: all
    environment:
      name: '${{ parameters.infra_environment }}'
      resourceType: VirtualMachine
      resourceName: 'lst-bench-head'
    strategy:
      runOnce:
        deploy:
          steps:
          - bash: |
              echo 'Deploy engine'
              sudo apt-get update
              sudo apt install -y $(JDK_INSTALLER_NAME) wget net-tools nmap
              mkdir -p ~/spark-$(SPARK_VERSION)
              cp $(Pipeline.Workspace)/lst-bench-0.1-SNAPSHOT/core/run/spark-$(SPARK_VERSION)/azure-pipelines/sh/* ~/spark-$(SPARK_VERSION)/
              cd ~/spark-$(SPARK_VERSION)
              chmod +x ./*
              wget -nv -N https://archive.apache.org/dist/hadoop/common/hadoop-3.3.1/hadoop-3.3.1.tar.gz
              wget -nv -N https://archive.apache.org/dist/spark/spark-$SPARK_VERSION/spark-$SPARK_VERSION-bin-hadoop3.tgz
              spark_head_node=$(ip addr show eth0 | sed -n 's/ *inet [^0-9]*\([0-9\.]\+\).*/\1/p')
              ./init.sh "${spark_head_node}" "$(data_storage_account)" "$(data_storage_account_shared_key)"
              ./dist-setup.sh
              ./dist-exec.sh spark-$(SPARK_VERSION) init.sh "${spark_head_node}" "$(data_storage_account)" "$(data_storage_account_shared_key)"

- stage: deploy_lst_client
  jobs:
  - deployment: ClientDeploy
    displayName: 'Deploying LST-Bench client'
    workspace:
      clean: all
    environment:
      name: '${{ parameters.infra_environment }}'
      resourceType: VirtualMachine
      resourceName: 'lst-bench-client'
    strategy:
      runOnce:
        deploy:
          steps:
          - bash: |
              echo 'Deploy LST-Bench client'
              sudo apt install -y $(JDK_INSTALLER_NAME)
              rm -rf ~/lst-bench-0.1-SNAPSHOT
              mkdir -p ~/lst-bench-0.1-SNAPSHOT
              cp -rf $(Pipeline.Workspace)/lst-bench-0.1-SNAPSHOT/* ~/lst-bench-0.1-SNAPSHOT/
              chmod +x ~/lst-bench-0.1-SNAPSHOT/launcher.sh

  # Run LST-Bench (setup external tables)
- stage: start_spark
  jobs:
  - deployment: StartEngine
    displayName: "Starting Engine"
    environment:
      name: '${{ parameters.infra_environment }}'
      resourceType: VirtualMachine
      resourceName: 'lst-bench-head'
    variables:
      process.clean: false
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - bash: |
              cd ~/spark-$(SPARK_VERSION)
              ./stop-cluster.sh && ./start-cluster.sh
              sleep 10
              spark_head_node=$(ip addr show eth0 | sed -n 's/ *inet [^0-9]*\([0-9\.]\+\).*/\1/p')
              echo "##vso[task.setvariable variable=spark_head_node;isOutput=true]${spark_head_node}"
            name: engine_start_step
  - deployment: RunSetupExperiment
    dependsOn: StartEngine
    displayName: "Setup Experiment"
    environment:
      name: '${{ parameters.infra_environment }}'
      resourceType: VirtualMachine
      resourceName: 'lst-bench-client'
    variables:
      spark_master_host: $[ dependencies.StartEngine.outputs['deploy_lst-bench-head.engine_start_step.spark_head_node'] ]
    timeoutInMinutes: 0
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - bash: |
              cd ~/lst-bench-0.1-SNAPSHOT
              ./launcher.sh -c core/run/spark-$(SPARK_VERSION)/azure-pipelines/config/connections_config.yaml \
                            -e core/run/spark-$(SPARK_VERSION)/azure-pipelines/config/setup_experiment_config.yaml \
                            -t core/run/spark-$(SPARK_VERSION)/azure-pipelines/config/telemetry_config.yaml \
                            -l core/run/spark-$(SPARK_VERSION)/config/tpcds/library.yaml \
                            -w core/run/spark-$(SPARK_VERSION)/config/tpcds/setup_experiment.yaml

  - deployment: StopEngine
    dependsOn: RunSetupExperiment
    displayName: "Stopping Engine"
    environment:
      name: '${{ parameters.infra_environment }}'
      resourceType: VirtualMachine
      resourceName: 'lst-bench-head'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - bash: |
              cd ~/spark-$(SPARK_VERSION)
              ./stop-cluster.sh

# Run LST-Bench
- ${{ each lst in parameters.lsts }}:
  - stage: setup_${{ lst.mode }}_${{ lst.table_format }}
    jobs:
    - deployment: SetupEngineForFormat
      displayName: "Setup Engine (${{ lst.mode }}, ${{ lst.table_format }}-${{ lst.version }})"
      environment:
        name: '${{ parameters.infra_environment }}'
        resourceType: VirtualMachine
        resourceName: 'lst-bench-head'
      strategy:
        runOnce:
          deploy:
            steps:
            - download: none
            - bash: |
                cd ~/spark-$(SPARK_VERSION)
                ./${{ lst.table_format }}-${{ lst.version }}.sh
                ./dist-exec2.sh spark-$(SPARK_VERSION) ${{ lst.table_format }}-${{ lst.version }}.sh
  - ${{ each workload in parameters.workloads }}:
    - ${{ if or(ne(lst.table_format, 'hudi'),ne(workload, 'wp4_time_travel')) }}:
      - stage: test_${{ lst.mode }}_${{ lst.table_format }}_${{ workload }}
        jobs:
        - deployment: StartEngineForExperiment
          displayName: "Starting Engine (${{ lst.mode }}, ${{ lst.table_format }}-${{ lst.version }}, ${{ workload }})"
          environment:
            name: '${{ parameters.infra_environment }}'
            resourceType: VirtualMachine
            resourceName: 'lst-bench-head'
          variables:
            process.clean: false
          strategy:
            runOnce:
              deploy:
                steps:
                - download: none
                - bash: |
                    cd ~/spark-$(SPARK_VERSION)
                    ./stop-cluster.sh && ./start-cluster.sh ${{ lst.table_format }}
                    sleep 10
                    spark_head_node=$(ip addr show eth0 | sed -n 's/ *inet [^0-9]*\([0-9\.]\+\).*/\1/p')
                    echo "##vso[task.setvariable variable=spark_head_node;isOutput=true]${spark_head_node}"
                  name: engine_start_step
        - deployment: RunExperiment
          dependsOn: StartEngineForExperiment
          displayName: "Running Experiment (${{ lst.mode }}, ${{ lst.table_format }}-${{ lst.version }}, ${{ workload }})"
          environment:
            name: '${{ parameters.infra_environment }}'
            resourceType: VirtualMachine
            resourceName: 'lst-bench-client'
          variables:
            spark_master_host: $[ dependencies.StartEngineForExperiment.outputs['deploy_lst-bench-head.engine_start_step.spark_head_node'] ]
          timeoutInMinutes: 0
          strategy:
            runOnce:
              deploy:
                steps:
                - download: none
                - bash: |
                    cd ~/lst-bench-0.1-SNAPSHOT
                    echo "${{ workload }}"
                    export EXP_NAME="${{ workload }}"
                    ./launcher.sh -c core/run/spark-$(SPARK_VERSION)/azure-pipelines/config/connections_config.yaml \
                                  -e core/run/spark-$(SPARK_VERSION)/azure-pipelines/config/experiment_config-${{ lst.mode }}-${{ lst.table_format }}-${{ lst.version }}.yaml \
                                  -t core/run/spark-$(SPARK_VERSION)/azure-pipelines/config/telemetry_config.yaml \
                                  -l core/run/spark-$(SPARK_VERSION)/config/tpcds/library.yaml \
                                  -w core/run/spark-$(SPARK_VERSION)/config/tpcds/${{ workload }}-${{ lst.table_format }}-${{ lst.version }}.yaml

